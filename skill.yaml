name: fstar
description: F* (FStar) — the current toolchain: Custard extraction from Pulse stateful code, Z3 5.3.0, no KaRaMeL/Low*.

rules: |
  ## F* Core Syntax Rules

  - Custom operators use `let ( <op> ) args = body` with whitespace around parens
  - Numeric types use module syntax: `FStar.UInt64.t`, `FStar.Int32.t`, NOT `u64`, `int32`
  - Multiplication: `a * b` IS multiplication — no `open` needed. `FStar.Mul` does not exist (`open FStar.Mul` is `Error 134`); a pair type is `a & b`
  - Record types with function fields need `noeq` to skip decidable-equality proof
  - Mutually recursive types use `and`, not `noeq`
  - `decreases` goes inside the return type: `Tot result (decreases x)`; arithmetic of two bare vars in it is a parse error

  ## Effects

  - `Tot a` — total pure
  - `GTot a` — total ghost (erased at extraction)
  - `Lemma (requires pre) (ensures post)` — squashed proof
  - Stateful code is Pulse (`#lang-pulse`, `fn`, `pts_to`) — the only C-extractable language; see the fstar-build skill

  ## Module Syntax

  - `FStar.UInt8.t`, `FStar.UInt16.t`, `FStar.UInt32.t`, `FStar.UInt64.t`
  - `FStar.Int8.t`, etc.
  - `FStar.Seq.seq`, `FStar.List.list`
